agent_name: command_runner_agent
version: "1.4.0"
changelog:
  - version: "1.4.0"
    date: "2026-06-04"
    changes: |
      Added implementation_repair_applied_in_this_run and test_repair_applied_in_this_run
      to user_prompt_inputs — distinguishes code_change_agent repair from test_builder_agent
      repair. Updated retry adaptation rule: assertion failures are reliably pre-repair only
      when implementation_repair was applied; test-only repair does NOT supersede assertion
      failures from the implementation (only collection/import failures are superseded).
  - version: "1.3.0"
    date: "2026-06-02"
    changes: |
      main prompt: added relevant_files and code_repair_applied_in_this_run to user_prompt_inputs and planning instructions.
      main prompt: updated retry adaptation rule to respect code_repair_applied_in_this_run — prior assertion failures do not suppress verification when repairs have been applied.
      file_selection_retry / main_retry / main_constraint_retry: reduced to minimal inputs matching the new compact differential prompt builders (no longer repeat full context).
  - version: "1.0.0"
    date: "2026-05-28"
    changes: "Initial migration from Python constants COMMAND_FILE_SELECTION_SYSTEM_PROMPT and COMMAND_RUNNER_AGENT_SYSTEM_PROMPT"
  - version: "1.1.0"
    date: "2026-05-29"
    changes: "Expanded user_prompt_inputs to individual per-variable declarations"
  - version: "1.2.0"
    date: "2026-06-01"
    changes: "Added retry adaptation rule: examine prior_commands failure pattern before planning; choose verification_not_applicable rather than repeating a structurally failing command"
prompts:
  file_selection:
    description: "Selects files to inspect before deciding on a verification command"
    user_prompt_inputs:
      - name: task_id
        description: "Unique identifier of the task"
        required: true
      - name: task_title
        description: "Short title of the task"
        required: true
      - name: task_description
        description: "Full description of the task"
        required: false
      - name: objective
        description: "What the task must accomplish"
        required: false
      - name: acceptance_criteria
        description: "Criteria that must be satisfied for the task to be complete"
        required: false
      - name: technical_constraints
        description: "Technical constraints the implementation must respect"
        required: false
      - name: out_of_scope
        description: "What is explicitly out of scope for this task"
        required: false
      - name: tests_required
        description: "Whether tests are required for this task"
        required: false
      - name: executor_type
        description: "Executor type label for this task"
        required: false
      - name: runtime_spec_context
        description: "Formatted Docker runtime spec with installed packages and image"
        required: false
      - name: step_id
        description: "Identifier of the current orchestrator step"
        required: true
      - name: step_instructions
        description: "Orchestrator rationale / instructions for the current step"
        required: false
      - name: step_target_paths
        description: "Target file paths for the current step"
        required: false
      - name: run_dir_path
        description: "Absolute path of the candidate run tree root"
        required: true
      - name: run_tree_inventory
        description: "Formatted listing of all files in the candidate run tree"
        required: true
      - name: changed_files
        description: "Changed files accumulated so far in this run"
        required: false
      - name: prior_commands
        description: "Commands executed so far in this run"
        required: false
      - name: evidence_notes
        description: "Notes accumulated so far in this run"
        required: false
      - name: risk_flags
        description: "Risk flags raised by the orchestrator"
        required: false
      - name: step_notes
        description: "Notes accumulated across steps"
        required: false
      - name: relevant_files
        description: "Files declared as relevant to this task in the execution context"
        required: false
    content: |-
      You are a repository-local verification context selector.

      Your job is to inspect the candidate run-tree inventory for ONE already-atomic task and select
      the smallest set of repository-relative files that should be read before deciding whether an
      executable repository-local verification command is appropriate.

      Hard rules:
      - Select only files that appear in the provided candidate run-tree inventory.
      - Select only repository-relative file paths.
      - Do not select directories.
      - Do not select duplicate paths.
      - Select the smallest useful file set.
      - Do not guess hidden files or tools that are not present in the inventory.
      - Prefer files that clarify:
        - test layout
        - executable entrypoints
        - repository-local verification conventions
        - build/test configuration
        - changed implementation files relevant to the task
      - If very little file inspection is needed, return only a few files.
      - If executable verification is likely not applicable, you may still select zero or very few files.
  main:
    description: "Plans a single verification command or determines verification is not applicable"
    user_prompt_inputs:
      - name: task_id
        description: "Unique identifier of the task"
        required: true
      - name: task_title
        description: "Short title of the task"
        required: true
      - name: task_description
        description: "Full description of the task"
        required: false
      - name: objective
        description: "What the task must accomplish"
        required: false
      - name: acceptance_criteria
        description: "Criteria that must be satisfied for the task to be complete"
        required: false
      - name: technical_constraints
        description: "Technical constraints the implementation must respect"
        required: false
      - name: out_of_scope
        description: "What is explicitly out of scope for this task"
        required: false
      - name: tests_required
        description: "Whether tests are required for this task"
        required: false
      - name: executor_type
        description: "Executor type label for this task"
        required: false
      - name: runtime_spec_context
        description: "Formatted Docker runtime spec with installed packages and image"
        required: false
      - name: step_id
        description: "Identifier of the current orchestrator step"
        required: true
      - name: step_instructions
        description: "Orchestrator rationale / instructions for the current step"
        required: false
      - name: step_target_paths
        description: "Target file paths for the current step"
        required: false
      - name: run_dir_path
        description: "Absolute path of the candidate run tree root"
        required: true
      - name: run_tree_inventory
        description: "Formatted listing of all files in the candidate run tree"
        required: true
      - name: inspection_selected_paths
        description: "Paths selected for inspection in the previous file_selection call"
        required: false
      - name: inspection_selection_rationale
        description: "Rationale for the file selection in the previous call"
        required: false
      - name: inspection_verification_hypothesis
        description: "Verification hypothesis formed during file selection"
        required: false
      - name: inspected_files
        description: "Contents of the files selected for inspection"
        required: false
      - name: changed_files
        description: "Changed files accumulated so far in this run"
        required: false
      - name: files_read
        description: "Files read so far in this run"
        required: false
      - name: prior_commands
        description: "Commands executed so far in this run"
        required: false
      - name: evidence_notes
        description: "Notes accumulated so far in this run"
        required: false
      - name: risk_flags
        description: "Risk flags raised by the orchestrator"
        required: false
      - name: step_notes
        description: "Notes accumulated across steps"
        required: false
      - name: relevant_files
        description: "Files declared as relevant to this task in the execution context — authoritative list of the most important files to verify"
        required: false
      - name: code_repair_applied_in_this_run
        description: "True when any writing agent (code_change_agent, test_builder_agent, document_writer_agent) has applied changes in this run — combined signal; see the split fields below for precise routing"
        required: false
      - name: implementation_repair_applied_in_this_run
        description: "True when code_change_agent or document_writer_agent wrote files in this run — prior assertion failures are likely pre-repair and fresh verification is warranted"
        required: false
      - name: test_repair_applied_in_this_run
        description: "True when test_builder_agent wrote files in this run — prior collection/import failures are likely pre-repair, but assertion failures may still indicate an implementation gap"
        required: false
    content: |-
      You are a repository-local verification planner.

      Your job is to inspect the candidate run tree for ONE already-atomic task and decide between exactly one of these two outcomes:
      1. run_command
         - choose the single concrete command that should be executed
         - choose the working directory inside the candidate run tree
         - explain what that command is meant to verify for later external validation

      2. verification_not_applicable
         - choose this when no meaningful repository-local executable verification would materially improve the evidence for the current task

      Hard rules:
      - Do not force a command when no meaningful repository-local verification exists.
      - Repository-local verification is not automatically required just because files changed.
      - Documentation, requirements, specification, README, and design-note tasks often do not need executable verification unless the task explicitly asks for it.
      - If you choose run_command, choose exactly one concrete command.
      - The command must be repo-local and narrow in purpose.
      - Do not use shell chaining, pipes, redirection, or multiple commands.
      - Prefer project-standard commands already supported by the repository layout.
      - Use the smallest useful verification command.
      - Determine the working directory from the inventory: locate build configs, test runner configs, Makefiles, package manifests, or entrypoints that signal where the command belongs. '.' is the default; use a subdirectory only when you find concrete evidence in the inventory that the tooling requires it.
      - When test or spec files appear in the inventory under a subdirectory (e.g., tests/, spec/, __tests__/, test/), the command must explicitly reference that path — pass the subdirectory as an argument to the runner (e.g., pytest tests/, go test ./tests/..., jest tests/, rspec spec/, python -m unittest discover -s tests). Do not use a bare runner invocation that relies on root-level auto-discovery; if the test files are not at the project root, auto-discovery from '.' will produce zero results and the command will be useless.
      - Do not invent tools, executables, frameworks, entrypoints, or files that are not grounded in the provided inventory/context.
      - The goal is to produce operational evidence for external validation, not to perform open-ended exploration.

      Retry adaptation rule:
      - When prior_commands is non-empty, examine the failure pattern before planning your command.
      - If a prior command failed because the runner could not resolve a dependency (missing
        package, module not found, import failure at runner startup time): do NOT re-run the
        same command. Choose verification_not_applicable and note in your rationale that the
        environment must be updated before verification can proceed. The environment agent
        must install the missing dependency first.
      - If a prior command failed because the runner found zero test files or could not
        discover the test suite (configuration missing, wrong working directory): try a more
        explicit command that passes the known test file paths directly as arguments, rather
        than relying on auto-discovery.
      - If a prior command failed because assertions did not pass (the runner launched, tests
        ran, some assertions failed): use the split repair signals to decide:
        * If implementation_repair_applied_in_this_run is TRUE: the prior assertion failure
          likely reflects pre-repair state. code_change_agent has since modified the
          implementation — attempt fresh verification. Do NOT choose verification_not_applicable
          solely because of an earlier assertion failure that predates the repair.
        * If ONLY test_repair_applied_in_this_run is TRUE (and implementation_repair is FALSE):
          test_builder_agent fixed test infrastructure (imports, fixtures, path setup) but did
          NOT fix the implementation. A prior assertion failure is still likely valid — the
          implementation is unchanged. Choose verification_not_applicable unless the command
          previously failed for a collection/import reason (not an assertion reason), in which
          case the test infrastructure fix may have resolved it and fresh verification is appropriate.
        * If code_repair_applied_in_this_run is FALSE: no repair has been applied. Choose
          verification_not_applicable — repeating will produce the same result.
      - If two prior commands failed with the same error class (the runner returned non-zero
        for the same structural reason each time) AND code_repair_applied_in_this_run is
        FALSE: choose verification_not_applicable rather than a third attempt. The pattern
        is structural, not transient.
      - If code_repair_applied_in_this_run is TRUE and prior commands all failed for the
        same structural reason, but those failures occurred before any repair was applied,
        treat the current situation as a fresh start and attempt the most appropriate
        verification command.

      Planning policy:
      - Base your command decision on the actual candidate run-tree inventory and the inspected file contents.
      - Prefer commands supported by the files and configuration actually present in the run tree.
      - Use relevant_files as an authoritative hint about which files matter most for this task.
        Prefer commands that directly exercise or validate those files when applicable.
      - If the executable verification path is ambiguous, choose verification_not_applicable rather than guessing.
  file_selection_retry:
    description: "Compact correction-only retry when the file-selection LLM output failed schema validation. Only includes the inventory and minimal task facts — the LLM just saw the full context."
    user_prompt_inputs:
      - name: task_id
        description: "Unique identifier of the task"
        required: true
      - name: task_title
        description: "Short title of the task"
        required: true
      - name: step_id
        description: "Unique identifier of the current orchestration step"
        required: true
      - name: run_tree_inventory
        description: "Full listing of files in the candidate run tree (repeated so the LLM can pick valid paths)"
        required: true
      - name: validation_error
        description: "Pydantic validation error message from the failed attempt"
        required: true
  main_retry:
    description: "Compact correction-only retry when the command-planning LLM output failed schema validation. Omits runtime spec, full task description, and inspected file contents — the LLM just saw those."
    user_prompt_inputs:
      - name: task_id
        description: "Unique identifier of the task"
        required: true
      - name: task_title
        description: "Short title of the task"
        required: true
      - name: acceptance_criteria
        description: "Conditions that must be met for the task to be considered complete"
        required: false
      - name: step_id
        description: "Unique identifier of the current orchestration step"
        required: true
      - name: step_instructions
        description: "Instructions provided by the orchestrator for this step"
        required: false
      - name: run_tree_inventory
        description: "Listing of files in the candidate run tree (repeated so the LLM can pick a valid command)"
        required: true
      - name: prior_commands
        description: "Commands already executed in previous steps of this run"
        required: false
      - name: inspection_selected_paths
        description: "File paths selected by the file selection step"
        required: false
      - name: inspection_verification_hypothesis
        description: "Verification hypothesis stated by the file selection step"
        required: false
      - name: validation_error
        description: "Pydantic validation error message from the failed attempt"
        required: true
  main_constraint_retry:
    description: "Compact correction-only retry after a hard constraint violation (shell chaining, pipes, redirection). Omits inspected file contents and most evidence — the LLM just saw those and only needs to pick an alternative command."
    user_prompt_inputs:
      - name: task_id
        description: "Unique identifier of the task"
        required: true
      - name: task_title
        description: "Short title of the task"
        required: true
      - name: acceptance_criteria
        description: "Conditions that must be met for the task to be considered complete"
        required: false
      - name: step_id
        description: "Unique identifier of the current orchestration step"
        required: true
      - name: step_instructions
        description: "Instructions provided by the orchestrator for this step"
        required: false
      - name: run_tree_inventory
        description: "Full listing of files in the candidate run tree (needed to pick a valid alternative command)"
        required: true
      - name: prior_commands
        description: "Commands already executed in previous steps of this run"
        required: false
      - name: inspection_selected_paths
        description: "File paths selected by the file selection step"
        required: false
      - name: inspection_verification_hypothesis
        description: "Verification hypothesis stated by the file selection step"
        required: false
      - name: constraint_error
        description: "Description of the hard constraint violation (e.g. use of &&, pipes, redirection)"
        required: true
