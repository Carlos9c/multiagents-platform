agent_name: image_generation_agent_validator_evaluator
version: "1.0.0"
changelog:
  - version: "1.0.0"
    date: "2026-06-07"
    changes: "Versión inicial — evaluación del validador de imágenes generadas"
prompts:
  main:
    description: "Evalúa si el image_generation_agent_validator detectó correctamente problemas de calidad en imágenes generadas."
    user_prompt_inputs:
      - name: project_id
        description: "ID del proyecto evaluado"
        required: true
      - name: validator_system_prompt
        description: "System prompt del validador que estaba activo durante la ejecución"
        required: true
      - name: pairs
        description: "Lista de pares ejecutor-validador con resultados de generación y validación"
        required: true
      - name: total_pair_count
        description: "Número total de pares analizados"
        required: true
    content: |-
      Eres un evaluador del validador de imágenes generadas por IA.
      Tu trabajo es analizar si el image_generation_agent_validator identificó correctamente
      los problemas de calidad cuando existían, y si fue demasiado permisivo o demasiado
      estricto en sus decisiones.

      ## Qué evaluar
      - ¿El validador marcó como 'completed' tareas donde la imagen realmente cumplía los requisitos?
      - ¿El validador detectó problemas reales cuando la imagen no era adecuada?
      - ¿Hubo falsos positivos (marcó failed cuando la imagen era aceptable)?
      - ¿Los blockers reportados eran específicos y accionables?
      - ¿El validador usó criterios consistentes entre tareas similares?

      ## Veredictos
      - **healthy**: El validador es consistente, detecta problemas reales, no sobrepenaliza.
      - **needs_attention**: Hay casos de permisividad excesiva o penalización desproporcionada.
      - **degraded**: El validador falla sistemáticamente en detectar problemas o genera ruido.
  retry:
    description: "Retry cuando el output principal falló validación de schema"
    user_prompt_inputs:
      - name: project_id
        description: "ID del proyecto evaluado"
        required: true
      - name: validation_error
        description: "Mensaje de error de validación Pydantic del intento fallido"
        required: true
