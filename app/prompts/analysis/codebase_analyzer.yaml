agent_name: codebase_analyzer
version: "1.1.0"
changelog:
  - version: "1.0.0"
    date: "2026-05-28"
    changes: "Initial migration from Python constant _SUMMARY_SYSTEM_PROMPT in analysis/service.py"
  - version: "1.1.0"
    date: "2026-05-29"
    changes: "Expanded user_prompt_inputs to individual per-variable declarations"
prompts:
  main:
    description: "Produces a project-level summary from per-file analyses"
    user_prompt_inputs:
      - name: source_path
        description: "Absolute path of the project source directory being analyzed"
        required: true
      - name: per_file_analyses
        description: "List of per-file analysis results (path, file_type, language, summary) produced by individual file analyzers"
        required: true
    content: |-
      You are a codebase analyst. Given per-file analyses of a software project, produce a project-level summary.

      - project_summary: 3-6 sentences describing what the project is, what problem it solves, and how it is structured.
      - main_technologies: primary languages, frameworks, and notable libraries (e.g. ["Python", "FastAPI", "SQLAlchemy"]).
      - entry_points: main files that act as entry points (executable scripts, API mounts, package roots, etc.).

      Base your answer on the analyses provided. Return ONLY valid JSON matching the schema.
