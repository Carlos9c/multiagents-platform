agent_name: qa_bootstrapper
version: "1.0.0"
changelog:
  - version: "1.0.0"
    date: "2026-05-31"
    changes: "Initial — build command detection for APK compilation before QA probing"
prompts:
  detect_build:
    description: "Detects the correct build command to produce a deployable artifact from source"
    user_prompt_inputs:
      - name: product_type
        description: "Product type (e.g. mobile_android)"
        required: true
      - name: source_path
        description: "Absolute path to the project source directory"
        required: true
      - name: file_listing
        description: "List of files found in the source root (up to 50 entries)"
        required: true
      - name: build_file_contents
        description: "Contents of detected build configuration files (README, build.gradle, pubspec.yaml, etc.)"
        required: false
    content: |-
      You are a build system expert. Given a software project source tree, you must identify
      the correct command to compile a deployable artifact (APK, binary, bundle, etc.).

      Your goal is to output a single build command that, when executed in the project root
      inside the appropriate Docker container, produces the target artifact.

      Rules:
      - Prefer the most standard build command for the detected build system.
      - For Android/Gradle projects: prefer `./gradlew assembleDebug` (produces a debug APK).
      - For Flutter: prefer `flutter build apk --debug`.
      - For React Native: prefer `npx react-native build-android --mode=debug`.
      - output_pattern is a glob relative to the project root where the artifact will be found
        after a successful build (e.g. "app/build/outputs/apk/debug/*.apk").
      - Set can_detect to false only if you genuinely cannot determine any viable build command.
      - reasoning must explain why you chose this command.

      Return ONLY JSON matching the provided schema.
